<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector</title>
    <style>
        /* Element Selector */
        div{
            /* background-color: red; */
        }
        /* class Selector */
        .red{
            background-color: red;
        }
        /* id selector */
        #green{
            background-color: green;
        }
        /* child Selector */
        div > p{
            background-color: brown;
            color: blue;
        }
        /* Descendent Selector */
        div p{
             background-color: brown;
            color: blue;
        }
        /* Universal Selector */
        *{
            margin: 0;
            padding: 0;
        }
       /* Pseudo Selector */
   a:visited{
    color: red;
   }
   a:link{
    color:green
   }
   a:active{
    background-color:blue;
   }
   a:hover{
    background-color: yellow;
   }
   p:first-child{
    background-color: aqua;

   }
   
   </style>
</head>
<body>
    <main class="one">
        <p>I am First</p>
        <p>I am Second</p>

    </main>
   <div class="red">
    I am a div
    <article>
    <p>
        I am a para inside div
    </p>
    </article>
   </div>
   <div id="green">
    I am a second div
   </div> 

   <a href="https://www.google.com">Go to Google</a>
   <a href="https://www.facebook.com">Go to Facebook</a>
  
</body>
</html>
